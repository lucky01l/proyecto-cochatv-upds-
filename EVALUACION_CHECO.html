 <script>
 <!-- EL ESTUDIANTE TRABAJA AQUÍ -->

            
function   buscarProducto(ID) {
return productos.find(producto =>  producto.id === ID);
}
            
function calcularSubtotal(pedido) {
return pedido.items.reduce((subtotal, item) => {
const producto = buscarProducto(item.productoId);
return subtotal + (producto.precio * item.cantidad);
}, 0);
}

function calcularDescuento(subtotal, tipoCliente) {
const descuentosBase = {
'estudiante': 10,
'frecuente': 7,
'regular': 0
};
let porcentajeDescuento = descuentosBase[tipoCliente] || 0; if (subtotal >= 120) {
porcentajeDescuento += 3;
}
porcentajeDescuento = Math.min(porcentajeDescuento, 15);

const montoDescuento = (subtotal * porcentajeDescuento) / 100;
const totalFinal = subtotal - montoDescuento;
return {
subtotal: subtotal,
porcentaje: porcentajeDescuento,
montoDescuento: montoDescuento,
totalFinal: totalFinal
}; }
 function calcularEnvio(zona, totalAntesEnvio) {
if (totalAntesEnvio >= 120) {
return 0;}
const costosEnvio = {
'A': 5,
    'B': 8,
       'C': 12
            };
 return costosEnvio[zona] || 0;
}

function calcularPuntos(totalAntesEnvio) {
   return Math.floor(totalAntesEnvio / 10);
 }
function obtenerNivel(puntos) {
 if (puntos >= 30) return "oro";
 if (puntos >= 20) return "plata";
return "bronce";
 }
class ResumenCliente {
  constructor(cliente) {
this.cliente = cliente;
this.cantidadPedidos = 0;
this.totalGastado = 0;
this.puntosTotales = 0;
}
agregarPedido(total, puntos) {
this.cantidadPedidos += 1;
this.totalGastado += total;
this.puntosTotales += puntos;
return this;}}          

console.log('='.repeat(60));
console.log('='.repeat(60));

const resumenes = {};
let totalVentasAntesEnvio = 0;
let totalRecaudadoEnvios = 0;

pedidos.forEach(pedido => {
const subtotal = calcularSubtotal(pedido);
const descuento = calcularDescuento(subtotal, pedido.tipoCliente);
 const costoEnvio = calcularEnvio(pedido.zona, descuento.totalFinal);
 
 const puntos = calcularPuntos(descuento.totalFinal);
 const nivel = obtenerNivel(puntos);
 const totalPagar = descuento.totalFinal + costoEnvio;
            
totalVentasAntesEnvio += descuento.totalFinal;
totalRecaudadoEnvios += costoEnvio;
//EL RESUMEN DE LOS CLIENTES SE ALMACENA EN UN OBJETO 
if (!resumenes[pedido.cliente]) {
resumenes[pedido.cliente] = new ResumenCliente(pedido.cliente);
}
resumenes[pedido.cliente].agregarPedido(totalPagar, puntos);});

Object.keys(resumenes).forEach(nombreCliente => {
const resumen = resumenes[nombreCliente];
const nivelCliente = obtenerNivel(resumen.puntosTotales);

console.log(`Pedidos: ${resumen.cantidadPedidos}`);
console.log(`Total gastado: Bs ${resumen.totalGastado.toFixed(2)}`);
console.log(`Puntos totales: ${resumen.puntosTotales} – Nivel: ${nivelCliente}`);
});
