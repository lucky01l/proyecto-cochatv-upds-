    <script>
      const productos = [
        { id: 1, nombre: "Hamburguesa", precio: 28, stock: 8 },

      const pedidos = [
        {
          id: 101,
          cliente: "Ana",
          tipoCliente: "regular",
          zona: "A",
          items: [
            { productoId: 1, cantidad: 2 },

        {
          id: 102,
          cliente: "Bruno",
          tipoCliente: "estudiante",
          zona: "B",
          items: [
            { productoId: 2, cantidad: 1 },
            { productoId: 5, cantidad: 1 },
          ],
        },
        {
          id: 103,
          cliente: "Carla",
          tipoCliente: "frecuente",
          zona: "C",
          items: [
            { productoId: 3, cantidad: 2 },
            { productoId: 4, cantidad: 1 },
            { productoId: 5, cantidad: 1 },
          ],
        },
        {
          id: 104,
          cliente: "Diego",
          tipoCliente: "regular",
          zona: "A",
          items: [
            { productoId: 1, cantidad: 1 },
            { productoId: 2, cantidad: 2 },
          ],
        },
        {
          id: 105,
          cliente: "Elena",
          tipoCliente: "estudiante",
          zona: "B",
          items: [
            { productoId: 3, cantidad: 1 },
            { productoId: 4, cantidad: 3 },
          ],
        },
        {
          id: 106,
          cliente: "Fabian",
          tipoCliente: "frecuente",
          zona: "C",
          items: [
            { productoId: 1, cantidad: 3 },
            { productoId: 5, cantidad: 2 },
          ],
        },
      ];
    </script>

    <script>
      console.log(
        "========================================\n Estudiante: Jonathan Figueroa\n========================================",
      );
      console.log("4.1) Función de búsqueda de producto");
      const buscarProducto = (id) => {
        return productos.find((p) => p.id === id) || null;
      };
      console.log("buscarProducto(3)");
      console.log(buscarProducto(3));
      console.log("buscarProducto(99)");
      console.log(buscarProducto(99));

      console.log("4.2) Cálculo del subtotal de un pedido");

      const calcularSubtotal = (pedido) => {
        return pedido.items.reduce((subtotal, item) => {
          const producto = buscarProducto(item.productoId);
          return subtotal + producto.precio * item.cantidad;
        }, 0);
      };
      const pedido106 = pedidos.find((p) => p.id === 106);
      console.log("calcularSubtotal(pedido 106)");
      console.log(calcularSubtotal(pedido106));
    </script>

    <script>
      // 4.3) Reglas comerciales: descuento por tipo de cliente + bono por monto
      console.log("4.3) Cálculo de descuento");
      const DESCUENTO_BASE = {
        estudiante: 0.1,
        frecuente: 0.07,
        regular: 0,
      };
      const DESCUENTO_MAXIMO = 0.15;
      const UMBRAL_BONO = 120;
      const BONO_EXTRA = 0.03;

      const calcularDescuento = (pedido, subtotal) => {
        let descuento = DESCUENTO_BASE[pedido.tipoCliente] ?? 0;
        if (subtotal >= UMBRAL_BONO) descuento += BONO_EXTRA;
        return Math.min(descuento, DESCUENTO_MAXIMO);
      };

      // 4.4) Costo de envío por zona, gratis si el total antes de envío es >= 120
      console.log("4.4) Cálculo de envío");
      const COSTO_ENVIO_POR_ZONA = { A: 5, B: 8, C: 12 };

      const calcularEnvio = (pedido, totalAntesEnvio) => {
        if (totalAntesEnvio >= UMBRAL_BONO) return 0;
        return COSTO_ENVIO_POR_ZONA[pedido.zona] ?? 0;
      };

      // 4.5) Fidelización: 1 punto por cada Bs 10 gastados (total final, parte entera)
      console.log("4.5) Fidelización y niveles");
      const calcularPuntos = (totalFinal) => Math.floor(totalFinal / 10);

      const calcularNivel = (puntos) => {
        if (puntos >= 30) return "Oro";
        if (puntos >= 20) return "Plata";
        return "Bronce";
      };

      // 4.6 (parte 1): clase para acumular el resumen de cada cliente
      class ResumenCliente {
        constructor(nombre) {
          this.nombre = nombre;
          this.totalPedidos = 0;
          this.totalGastado = 0;
          this.puntos = 0;
        }

        agregarPedido(total, puntos) {
          this.totalPedidos += 1;
          this.totalGastado += total;
          this.puntos += puntos;
        }

        get nivel() {
          return calcularNivel(this.puntos);
        }
      }

      // 4.6 (parte 2): procesamiento de cada pedido + reportes en consola
      console.log("4.6) Procesamiento de pedidos y reportes");

      const resumenesPorCliente = {};
      let totalGeneralVentas = 0;
      let totalGeneralDescuentos = 0;
      let totalGeneralEnvios = 0;

      pedidos.forEach((pedido) => {
        const subtotal = calcularSubtotal(pedido);
        const porcentajeDescuento = calcularDescuento(pedido, subtotal);
        const montoDescuento = subtotal * porcentajeDescuento;
        const totalAntesEnvio = subtotal - montoDescuento;
        const envio = calcularEnvio(pedido, totalAntesEnvio);
        const totalFinal = totalAntesEnvio + envio;
        const puntos = calcularPuntos(totalFinal);

        console.log(`--- Pedido ${pedido.id} (${pedido.cliente}) ---`);
        console.log(`  Subtotal:        Bs ${subtotal.toFixed(2)}`);
        console.log(
          `  Descuento:       ${(porcentajeDescuento * 100).toFixed(0)}% (Bs ${montoDescuento.toFixed(2)})`,
        );
        console.log(`  Envío:           Bs ${envio.toFixed(2)}`);
        console.log(`  Total a pagar:   Bs ${totalFinal.toFixed(2)}`);
        console.log(`  Puntos ganados:  ${puntos}`);

        totalGeneralVentas += totalFinal;
        totalGeneralDescuentos += montoDescuento;
        totalGeneralEnvios += envio;

        if (!resumenesPorCliente[pedido.cliente]) {
          resumenesPorCliente[pedido.cliente] = new ResumenCliente(
            pedido.cliente,
          );
        }
        resumenesPorCliente[pedido.cliente].agregarPedido(totalFinal, puntos);
      });

      console.log("========================================");
      console.log("TOTALES GENERALES");
      console.log("========================================");
      console.log(
        `Total vendido (con envío):   Bs ${totalGeneralVentas.toFixed(2)}`,
      );
      console.log(
        `Total descuentos otorgados:  Bs ${totalGeneralDescuentos.toFixed(2)}`,
      );
      console.log(
        `Total cobrado por envíos:    Bs ${totalGeneralEnvios.toFixed(2)}`,
      );

      console.log("========================================");
      console.log("RESUMEN POR CLIENTE");
      console.log("========================================");
      Object.values(resumenesPorCliente).forEach((resumen) => {
        console.log(
          `${resumen.nombre}: ${resumen.totalPedidos} pedido(s), ` +
            `Bs ${resumen.totalGastado.toFixed(2)} gastados, ` +
            `${resumen.puntos} puntos, nivel ${resumen.nivel}`,
        );
      });

      // ---- 6) Pruebas mínimas de validación ----
      console.log("========================================");
      console.log("PRUEBAS DE VALIDACIÓN");
      console.log("========================================");
      console.log("buscarProducto(3) debe ser Ensalada:", buscarProducto(3));
      console.log("buscarProducto(99) debe ser null:", buscarProducto(99));

      const subtotal106 = calcularSubtotal(pedido106);
      console.log(
        "Pedido 106 (Fabian) descuento debe ser 7%:",
        `${(calcularDescuento(pedido106, subtotal106) * 100).toFixed(0)}%`,
      );

      const pedidoAlto = {
        id: 999,
        cliente: "Test",
        tipoCliente: "regular",
        zona: "A",
        items: [{ productoId: 2, cantidad: 5 }],
      };
      const subtotalAlto = calcularSubtotal(pedidoAlto);
      const descuentoAlto = calcularDescuento(pedidoAlto, subtotalAlto);
      const totalAntesEnvioAlto = subtotalAlto * (1 - descuentoAlto);
      console.log(
        "Pedido >= Bs120 envío debe ser 0:",
        calcularEnvio(pedidoAlto, totalAntesEnvioAlto),
      );

      console.log(
        "Cliente con >=30 puntos debe ser nivel Oro:",
        calcularNivel(30),
      );
    </script>
